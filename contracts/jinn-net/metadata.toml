# Contract-bundle metadata for jinn:net@0.2.0 (M2-K6; outbound M2-K14)

[contract]
name    = "jinn:net"
version = "0.2.0"

[scope]
type   = "net-policy"
# Decidable subset predicate the kernel evaluates for attenuation (01 §Grants):
# a scope is `{ bind = [<low port>, <high port>], outbound = [<host>...] }`,
# both keys optional. subset(a, b) := a's bind range sits inside b's and a's
# outbound hosts are a subset of b's. Bind is LOOPBACK ONLY in v0.1: a
# non-loopback address refuses on the record whatever the range. FAIL-CLOSED
# (M2-K2 law): any other scope shape or type REFUSES the grant with a
# ledgered per-entry error. A grant with no scope holds the EMPTY policy —
# no bind range, no outbound host: default deny. SEVERAL grants of this
# contract to one entry compose as the exact SET of their bind ranges
# (normalized: sorted, overlapping/adjacent coalesced), never their hull —
# a hull would confer a port between two disjoint grants that neither one
# named (Law 1). listen admits a port iff SOME held range contains it.
# Profile syntax (04 §Format): `{ contract = "jinn:net", scope = { bind =
# [7800, 7899] } }`.
subset = "bind-range-containment-and-outbound-host-subset"
# OUTBOUND MATCHING (M2-K14). An `outbound` entry and a request URL are
# both normalized to `host:port` — lowercased host, the scheme's default
# port (80 for http) supplied when the entry or the URL omits it — and the
# entry admits the URL iff the two normal forms are EQUAL. No wildcards, no
# suffix match, no "host alone means every port": granting `example.com`
# confers `example.com:80` and nothing else, exactly as a bind grant of
# `[1000,1000]` and `[2000,2000]` never confers 1500 (Law 1, the M2-K8
# round-3 ruling read for hosts). A plugin cannot widen its own allowlist:
# `jinn:net` has no operation that writes a grant, and `jinn:profile`
# refuses an entry patching itself. KNOWN LIMIT, stated: an entry granted
# `jinn:profile` over ANOTHER entry can widen THAT entry's outbound
# allowlist — granting profile-edit over an entry IS granting its
# authority, and narrowing that is profile authoring, not kernel work.

[operations.request]
# LAW 3, THE FIRST GENUINELY IRREVERSIBLE EFFECT (03 §Irreversible): a sent
# request cannot be un-sent. There is no inverse and no declared
# compensator — the kernel cannot know what would correct an arbitrary
# call. A revert unit containing a request event is REJECTED WHOLE, with a
# typed refusal naming the effect it could not revert and why; nothing in
# the unit is applied, so a partial revert can never be mistaken for a
# clean one (03 §51).
#
# The refusal is DURABLE, not merely live (M2-K14 round 2). The `effect`
# id is carried in the `NetRequested` ledger row, so the kernel names a
# sent request as irreversible after a reopen exactly as it does in the
# process that sent it. A guarantee that expires with a process is not a
# guarantee; it is the vacuity class this packet exists to prevent. The
# provider's effect counter is seeded past the highest durable id at boot,
# so an id is never reused across a reopen either.
effect      = "irreversible"
sensitivity = "personal"

[operations.send-request]
# The whole-response edition of `request`, added BESIDE it in 0.2.0 (R12:
# additive within a major). Identical in every respect that matters here —
# same `outbound` authority, same ledger row, same irreversible class, same
# bounds — differing only in how much of the call and the answer the caller
# may see. Two handles, one door.
effect      = "irreversible"
sensitivity = "personal"

[operations.listen]
effect      = "kernel-registration"
sensitivity = "public"
inverse     = "close-listener"

[operations.accept]
effect      = "kernel-registration"
sensitivity = "public"
inverse     = "close-connection"

[operations.read]
effect      = "data-plane"
sensitivity = "personal"

[operations.write]
effect      = "data-plane"
sensitivity = "personal"

[operations.close]
effect      = "data-plane"
sensitivity = "public"

[equality]
# Observational equivalence: the set of live listeners and connections held
# under the granted scope. Bytes are data plane (never ledgered, decision
# log 2026-08-25); listen / accept / close are ledger history (02).
relation = "live-socket-set-under-scope"

[notes]
# Lifecycle class (jinn:plugin@0.4.0, M2-K6): listeners and connections are
# KERNEL REGISTRATIONS — suspend and incarnation replacement close them
# (ledgered); the next `activate` re-listens. Dispose closes them in the
# LIFO trail.
lifecycle = "kernel-registration-closed-on-suspend-relistened-on-activate"
# Every listen, accept, close, and REQUEST is a ledger event with entry
# attribution (Law 2). accept/read answer `would-block`, write answers the
# accepted count (R1). Out of scope in v0.2: TLS and non-loopback outbound
# (M2-K15), non-loopback listening, UDP.
#
# WHAT A REQUEST WRITES TO THE LEDGER (M2-K14; Law 2 vs 02 §Redaction).
# `NetRequested { effect, method, host, path, status, request_bytes,
# response_bytes, duration_ms }` — the SHAPE of the call, never its
# content. `effect` leads because it is what makes the irreversible class
# above DURABLE: it is the id a revert unit names, and without it on the
# row the refusal would live only as long as the process that sent the
# call. Never the request or response body, never any header (an
# `Authorization` header carries exactly the credential the keystore
# exists to protect), and never the URL's query string, which routinely
# carries one too (`?access_token=`). The path is recorded up to `?`. A
# URL carrying userinfo (`http://user:pw@host/`) is refused as `invalid`
# rather than recorded with its credential stripped: the kernel does not
# quietly accept a call whose authority it had to edit.
#
# REDIRECTS: stated in full beside `send-request` in contract.wit. In
# short — never followed, `denied` inside the call when the hop names an
# authority the allowlist does not admit, and the `NetRequested` row is
# written FIRST either way, because the hop that produced it was really
# sent and cannot be un-sent.
#
# BOUNDS (R9: nothing unbounded). The whole call is bounded at 3s —
# deliberately UNDER the 5s guest-call deadline, so a slow target answers
# the guest a typed `failed` instead of killing its activation (the M2-K12
# lesson). The response body is capped at 1 MiB; past the cap the call is
# a typed `failed`, never a truncated body passed off as whole.
# Readiness wake (M2-K7, additive): `lifecycle.handle-event(handle,
# "jinn:net/readable", 8-byte LE handle)` on a listener's pending
# connection or a connection's bytes/EOF — one wake per transition the
# guest has not acted on (accept/read re-arm; EOF wakes once), each a
# `NetReadable { handle }` ledger event under the holder's attribution.
wake = "jinn:net/readable-one-per-unacted-transition"
