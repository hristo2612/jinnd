# Contract-bundle metadata for jinn:fs@0.2.0 (M2-K3: finalized; additive
# edition over 0.1.0 per R12 — `meta` and `append` added, `remove`
# reclassified revertible, every 0.1.0 operation unchanged in shape).

[contract]
name    = "jinn:fs"
version = "0.2.0"

[scope]
type   = "path-prefix"
# Decidable subset predicate the kernel evaluates for attenuation (01 §Grants):
# subset(a, b) := normalize(a) starts-with normalize(b), after symlink and
# dot-segment resolution. A grant with no scope is the root scope.
subset = "path-prefix-containment"

[operations.list]
effect      = "read"
sensitivity = "personal"

[operations.read]
effect      = "read"
sensitivity = "personal"

[operations.meta]
effect      = "read"
sensitivity = "personal"

[operations.write]
effect      = "revertible"
sensitivity = "personal"
# Inverse obligation (03): restore the file's prior content, or prior absence.
# Witness: post-inverse state observationally equal to pre-state under [equality].
inverse     = "restore-prior-content-or-absence"

[operations.append]
effect      = "revertible"
sensitivity = "personal"
# Inverse obligation (03): truncate the file to its prior length, or restore
# prior absence. Witness: the file's length equals the recorded prior length.
inverse     = "truncate-to-prior-length-or-absence"

[operations.remove]
effect      = "revertible"   # 0.2.0: was irreversible in 0.1.0 (no trash)
sensitivity = "personal"
# Inverse obligation (03): restore the removed file's prior content.
inverse     = "restore-prior-content"

[equality]
# Observational equivalence: same paths with same byte content and same dir
# structure under the granted scope. Timestamps and inode identity are NOT
# observable state.
relation = "content-tree-under-scope"

[retention]
# Effect-retention policy (M2-K3; harness finding 8): every revertible
# effect's inverse is made DURABLE in the provider's retention store —
# keyed by effect id, outside the granted scope — BEFORE the mutation
# commits. If the inverse cannot be made durable the effect is REFUSED with
# a ledgered per-entry error (fail-closed: revertibility is never silently
# weakened). Provider memory holds an index of labels, never prior
# contents; a completed revert consumes the inverse and reclaims its
# storage. Retention is event-driven (register/revert) — no compaction
# daemon, no expiry window.
policy   = "durable-before-commit-refuse-otherwise"
reclaim  = "on-completed-revert"
