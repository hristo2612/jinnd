[package]
name = "jinnd-fiber"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Model checking only: swaps the steering cell's primitives for loom's and drops
# the tokio supervisor from the build. Off by default, never a runtime dependency.
loom = ["dep:loom"]

[dependencies]
jinnd-api = { path = "../jinnd-api" }
jinnd-effects = { path = "../jinnd-effects" }
loom = { version = "0.7.2", optional = true }
tokio = { version = "1.47.1", features = ["macros", "rt", "sync"] }
tokio-util = "0.7.19"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt", "sync", "time"] }
