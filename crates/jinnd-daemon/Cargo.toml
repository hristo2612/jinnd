# The `jinnd` binary (M1-P9): production assembly ONLY — profile → loader →
# registry/fiber/effects/events → ledger (real SQLite path) → wasm host
# through the broker. The conformance-harness lane is NOT in this build:
# jinnd-api arrives with default-features = false, and this crate never
# depends on jinnd-adapter (test-harness ruling 2026-08-25; Law 1).
# Proof: `cargo tree -p jinnd-daemon -e features` shows no `harness`.
[package]
name = "jinnd-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "jinnd"
path = "src/main.rs"

[dependencies]
jinnd-api = { path = "../jinnd-api", default-features = false }
jinnd-context = { path = "../jinnd-context" }
jinnd-fiber = { path = "../jinnd-fiber" }
jinnd-ledger = { path = "../jinnd-ledger" }
jinnd-loader = { path = "../jinnd-loader" }
jinnd-registry = { path = "../jinnd-registry" }
jinnd-wasm = { path = "../jinnd-wasm" }
# File watching is the daemon's one job beyond assembly (M1-P9 card:
# pre-authorized, R10-justified).
notify = "8"
serde_json = "1.0"
# Structured tracing to stderr (M1-P9 card operations requirement; tracing is
# in the AGENTS.md preferred set).
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.47.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# The `jinn:auth` bundle is asserted by PARSING, never by substring (the
# M2-K15 round-2 ruling; the M2-K19 `toml` precedent). Both are dev-only —
# ZERO runtime surface, ZERO new packages in the lockfile: `toml` is already
# a jinnd-wasm dev-dep and `wit-parser` rides in with the `wit-component`
# dev-dep below (M2-K21).
toml = { version = "1.1.4", default-features = false, features = ["parse", "std"] }
wit-parser = "0.233.0"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
# Encodes the checked-in fixture SOURCE to a component for the end-to-end
# clock test (M2-K2), exactly as the jinnd-wasm host suite does — no
# artifact binary is ever checked in.
wit-component = "0.233.0"
