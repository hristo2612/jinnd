[package]
name = "jinnd-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Model checking only: pins the Mode-1 swap core's interleavings under loom.
# Off by default, never a runtime dependency.
loom = ["dep:loom"]

[dependencies]
# The wasm host runtime. MUST stay in the general dependency table: it is the
# core runtime of this crate on every platform. It was captured by the macOS
# keychain target block in 8d58501 (M2-K8 round 2), which left Linux CI without
# it and turned `gates`, `invariants` and `loom` red on every commit for days
# while macOS dev machines stayed green.
wasmtime = { version = "34.0.2", default-features = false, features = ["runtime", "component-model", "cranelift", "async"] }
# The jinn:keystore provider's at-rest encryption (M2-K8; R10 justification:
# a vetted RustCrypto AEAD for secrets on disk beats any in-tree cipher;
# no std, no rand, alloc only) and the OS entropy its master key and
# nonces come from (getrandom is already in the tree through wasmtime).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.3"
# The keystore's passphrase-derived master key (M2-K8 round-2 ruling 1;
# R10: a vetted RustCrypto scrypt beats any in-tree KDF; no default
# features, so no password-hash framework rides along).
scrypt = { version = "0.11", default-features = false }
# Types-only contract crate, WITHOUT the harness lane: the production plugin
# path is WIT/broker only (test-harness ruling 2026-08-25; M1-P8 acceptance).
jinnd-api = { path = "../jinnd-api", default-features = false }
# The lifted production lane machinery (M2-K1; PLA-283 ruling) backs the
# loader's package-lane seam with fiber bodies and registers its teardown
# through the effect primitive — these are the deps the moved code already
# carried in the daemon (R10: a move, not a feature).
jinnd-context = { path = "../jinnd-context" }
jinnd-effects = { path = "../jinnd-effects" }
jinnd-fiber = { path = "../jinnd-fiber" }
jinnd-loader = { path = "../jinnd-loader" }
loom = { version = "0.7.2", optional = true }
# `process`/`net`/`io-util`: the jinn:process and jinn:net base host
# providers (M2-K6; R7) — tokio features, no new crate.
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
# The moved jinn:fs provider's operator log line (AGENTS.md preferred set).
tracing = "0.1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
webpki-roots = "1"

# Typed signal delivery for `jinn:process.kill` (M2-K6). This crate is
# forbid(unsafe_code); the one libc `kill(2)` call lives in this vetted
# wrapper (feature `signal` only) rather than in an unsafe block in the
# kernel — R10: zero kernel LOC for the syscall, R11: containment lint
# untouched. libc itself is already in the tree (tokio).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

# The kernel's own vault master key lives in the platform keychain on macOS
# (M2-K8 round-2 ruling 1; the `security` CLI through jinn:process is not
# acceptable for it). R10: the vetted Security-framework binding, generic
# passwords only, no default features; this crate stays forbid(unsafe_code).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", default-features = false }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# test-util: paused-clock tests drive the alarm timers deterministically
# (M2-K2); dev-only, never a runtime dependency.
tokio = { version = "1.47.1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
# The shipped contract bundles (`contracts/*/metadata.toml`) are CONTRACTS
# OF RECORD, and the pin that they parse belongs to the crate that defines
# the grammar (M2-K19 round-3 ruling; src/bundles.rs). R10: dev-only, so
# ZERO runtime surface — the bundles ship as `include_str!` constants and
# nothing in the kernel's hot path parses TOML — and R10's own metric note
# excludes `cfg(test)` code from the kernel-core count. "Small and boring"
# argues FOR it: a hand-written TOML reader is neither, and the two the
# workspace already tried both shipped a hole. `parse` only: the
# serde-free `DeTable` document API, no serializer, no derive, no serde.
toml = { version = "1.1.4", default-features = false, features = ["parse", "std"] }
wit-component = "0.233.0"
# The contract of record is asserted by PARSING, never by substring
# (M2-K15 round-2 ruling; the M2-K19 `toml` precedent for the bundles).
# A `contains` observes bytes wherever they sit — a version in a doc
# comment satisfies it while the declaration below says something else —
# and it cannot see a variant case's payload at all. R10: dev-only, ZERO
# runtime surface, and ZERO new packages in the lockfile — `wit-parser`
# 0.233.0 is already in the tree as a public dependency of the
# `wit-component` dev-dep above, and its types cannot be named without
# depending on it directly. A hand-written WIT reader is neither small
# nor boring.
wit-parser = "0.233.0"
