[workspace]
resolver = "3"
members = [
    "crates/jinnd-adapter",
    "crates/jinnd-api",
    "crates/jinnd-contract-lens",
    "crates/jinnd-context",
    "crates/jinnd-daemon",
    "crates/jinnd-effects",
    "crates/jinnd-events",
    "crates/jinnd-fiber",
    "crates/jinnd-ledger",
    "crates/jinnd-loader",
    "crates/jinnd-registry",
    "crates/jinnd-wasm",
    "tests/demo",
    "tests/invariants",
    "tools/loc-meter",
]
# Crates are added as M1 work packets land. Planned (per SOURCE-OF-TRUTH §6 budgets):
#   crates/jinnd-context   — context tree, isolation, intercept
#   crates/jinnd-effects   — effect/undo engine
#   crates/jinnd-fiber     — fiber lifecycle (R1: tokio supervisor tasks; loom-tested)
#   crates/jinnd-registry  — services, epochs, availability gating
#   crates/jinnd-events    — event bus
#   crates/jinnd-loader    — profiles, reconcile, write-back
#   crates/jinnd-ledger    — append-only ledger + revert
#   crates/jinnd-macros    — #[derive(Plugin)], #[inject]
#   crates/jinnd           — the daemon binary (hosts, capability broker, axum API)

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# R11 rests on unwinding: a panic="abort" profile would silently void the kernel's
# panic containment (audit 2026-08-25). Pin unwind explicitly.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

# The keystore's KDF is deliberately expensive (scrypt N=2^15, ~32 MiB). At
# `dev` codegen that one derivation costs seconds rather than milliseconds,
# and it is charged to the guest-call deadline (R11 containment horizon)
# because a plugin's first `jinn:keystore` mutation unlocks the store inside
# its own `activate`. On a modest CI machine that alone exceeded the
# deadline, killing the activation mid-put and leaving an EMPTY store — the
# M2-K12 defect. Codegen only: no cryptography, parameter, or KDF choice
# changes, and the release profile is untouched.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
