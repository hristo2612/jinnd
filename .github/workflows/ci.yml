name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # The wasm host tests build the fixture guest from source (M1-P8).
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --exclude jinnd-invariants
      # M2-K12: the break that hid this packet's defect was a dependency
      # captured under a macOS-only target table, so the workspace stopped
      # resolving on Linux. A locked build on Linux is that class's gate.
      - name: locked build
        run: cargo build --workspace --locked
      # HEURISTIC, not the guarantee. Reads test sources for conditional
      # compilation. It is fast and it is incomplete by construction — two
      # rounds of this packet were defeated by a form its author had not
      # imagined. The guarantee is the `test-inventory-differential` job.
      - name: platform-gate heuristic (fast, NOT the guarantee)
        run: bash .github/scripts/check-no-platform-gated-tests.sh
      # An untested guard rots the day someone edits it. These run each guard
      # against a fixture per divergence it claims to catch, proven to make it
      # exit non-zero, plus legitimate shapes proven to leave it green.
      - name: platform-gate heuristic fixtures
        run: bash .github/scripts/test-no-platform-gated-tests.sh
      - name: test-inventory differential fixtures
        run: bash .github/scripts/test-check-test-inventory.sh
      - name: push two-key tripwire fixtures
        run: bash .github/scripts/test-push-two-key.sh

  # M2-K12 — the GUARANTEE that a platform-only property cannot silently
  # return. Not a source scanner: each platform reports the tests it actually
  # compiled in, and the differential below refuses any test that exists on one
  # and not the other. It cannot be walked past by a spelling, and it catches
  # causes no scanner models — a feature flag, a build script, an absent
  # target, or a dependency captured under a platform-only table, which is the
  # defect that opened this packet.
  test-inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: the tests this platform actually compiled in
        run: bash .github/scripts/test-inventory.sh "test-inventory-${{ matrix.os }}.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: test-inventory-${{ matrix.os }}
          path: test-inventory-${{ matrix.os }}.tsv

  test-inventory-differential:
    needs: test-inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: test-inventory-*
          merge-multiple: true
      - name: no test exists on one platform and not the other
        run: |
          bash .github/scripts/check-test-inventory.sh \
            linux test-inventory-ubuntu-latest.tsv \
            macos test-inventory-macos-latest.tsv

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The handle cases build the demo kit from source (demo/builder),
          # exactly as the wasm host tests do — same target requirement.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: invariant suite + expected-green ratchet
        run: tests/invariants/check-ratchet.sh

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: loom models — the inertia lock's interleavings (R1)
        run: cargo test -p jinnd-fiber --features loom --release
      - name: loom models — the registry's lease/slot interleavings (I2, R9)
        run: cargo test -p jinnd-registry --features loom --release
      - name: loom models — the event bus's once-claim and snapshot (R1, R9)
        run: cargo test -p jinnd-events --features loom --release
      - name: loom models — the swap core's commit/dispose race (R8, M1-P8)
        run: cargo test -p jinnd-wasm --features loom --release --lib

  miri:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install miri
        run: rustup component add miri --toolchain nightly
      - name: miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test -p jinnd-context -p jinnd-effects -p jinnd-events -p jinnd-fiber -p jinnd-loader -p jinnd-registry

  test-protection:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: two-key rule — tests/invariants is verifier-owned
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- tests/invariants/ | wc -l)
          IMPL=$(git diff --name-only "$BASE" "$HEAD" -- crates/ ':(exclude)crates/jinnd-api/**' | wc -l)
          if [ "$CHANGED" -gt 0 ] && [ "$IMPL" -gt 0 ]; then
            NON_BOOTSTRAP=$(git diff --name-only --diff-filter=AMDR "$BASE" "$HEAD" -- crates/ ':(exclude)crates/jinnd-api/**' ':(exclude)crates/jinnd-adapter/**' | wc -l)
            ADAPTER_NOT_ADDED=$(git diff --name-only --diff-filter=MDR "$BASE" "$HEAD" -- crates/jinnd-adapter/ | wc -l)
            if [ "$NON_BOOTSTRAP" -gt 0 ] || [ "$ADAPTER_NOT_ADDED" -gt 0 ]; then
              echo "::error::PR touches BOTH tests/invariants/ and implementation crates — the two-key rule (SOURCE-OF-TRUTH R2) forbids this outside the one-time adapter bootstrap."
              exit 1
            fi
          fi
          if [ "$CHANGED" -gt 0 ]; then
            LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
            echo "$LABELS" | grep -q "verifier-approved" || {
              echo "::error::tests/invariants/ changed without the 'verifier-approved' label."
              exit 1
            }
          fi

  # A push cannot be blocked retroactively. Red here means main requires investigation.
  push-test-protection:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: two-key tripwire — verify independent invariant authorship
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: bash .github/scripts/check-push-two-key.sh "$BASE" "$HEAD"
