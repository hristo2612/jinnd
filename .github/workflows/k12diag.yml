name: k12diag
on:
  push:
    branches: [packet/m2-k12-linux-ci-keystore]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: keystore suite, serial, instrumented
        run: cargo test -p jinnd-daemon --test keystore -- --nocapture --test-threads=1
      - name: keystore suite, parallel, instrumented
        if: always()
        run: cargo test -p jinnd-daemon --test keystore -- --nocapture

  invariants-target-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: the one red invariant case, with the wasm target installed
        run: cargo test -p jinnd-invariants --test cordis_handles -- --nocapture
