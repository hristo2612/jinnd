# The headless M1 acceptance demo (implementer-owned, M1-P9): drives the
# daemon-assembled kernel through the same five steps as the operator runbook
# docs/demo/M1-DEMO.md, so the demo cannot rot. NOT part of tests/invariants
# (two-key rule): this is the implementer's integration lane.
[package]
name = "jinnd-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[dependencies]
jinnd-api = { path = "../../crates/jinnd-api", default-features = false }
jinnd-daemon = { path = "../../crates/jinnd-daemon" }
serde_json = "1.0"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time"] }

[lib]
path = "lib.rs"

[[test]]
name = "demo"
path = "demo.rs"
